[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emerge-loaded-antenna"
version = "0.3.0"
description = "Parameterized EMerge model for variable-coil loaded antennas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "emerge>=2.8.4,<3",
    "numpy>=2.0",
]

[project.optional-dependencies]
optimize = ["scipy>=1.12"]
verify = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["emerge_loaded_antenna*"]

[tool.setuptools.package-data]
emerge_loaded_antenna = ["data/*.json"]
